<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    
    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4">Sign UP</h2>
    <form>
    <div class="mb-3">
        <label for="fname" class="form-label">First Name:</label>
        <input type="text" class="form-control" id="fname" aria-describedby="fnamelHelp">
    </div>
    <div class="mb-3">
        <label for="lname" class="form-label"> Last Name: </label>
        <input type="text" class="form-control" id="lname" aria-describedby="lnamelHelp">
    </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  <div class="mb-3">
    <label for="confirmPassword" class="form-label">Confirm Password</label>
    <input type="password" class="form-control" id="confirmPassword">
    <div id="passwordMismatch" class="text-danger mt-1" style="display:none;">Passwords do not match.</div>
  </div>

  <button type="submit" class="btn btn-success w-100">Sign Up</button>
</form>

<script>
  document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('exampleInputPassword1').value;
    const confirm = document.getElementById('confirmPassword').value;
    const msg = document.getElementById('passwordMismatch');
    if (password !== confirm) {
      e.preventDefault();
      msg.style.display = 'block';
    } else {
      msg.style.display = 'none';
    }
  });
</script>

<p class="text-center mt-3">
    Already have an account? <a href="index.html">Login</a>
</p>
</div>


</body>
</html>
