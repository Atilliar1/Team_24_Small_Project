<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – SM App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-from:    #6aaee0;
      --bg-to:      #89c0eb;
      --card-bg:    #ffffff;
      --brand:      #0c4480;
      --brand-dark: #093568;
      --brand-deep: #062650;
      --text-head:  #05111e;
      --text-sub:   #456070;
      --label:      #0c4480;
      --border:     #7ab2d8;
      --focus-ring: rgba(12, 68, 128, 0.22);
      --error:      #b91c1c;
      --error-bg:   #fef2f2;
      --font:       'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-to) 100%);
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(12,68,128,0.15) 0%, transparent 70%);
      top: -160px; right: -160px;
    }
    body::after {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(12,68,128,0.10) 0%, transparent 70%);
      bottom: -120px; left: -120px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      border: 1px solid rgba(12,68,128,0.18);
      border-radius: 20px;
      box-shadow:
        0 2px 4px rgba(5,17,30,0.06),
        0 8px 24px rgba(5,17,30,0.14),
        0 24px 56px rgba(5,17,30,0.10);
      background: var(--card-bg);
      padding: 2.5rem 2.25rem;
      animation: rise 0.45s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-head);
      margin-bottom: 0.3rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--text-sub);
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
    }

    .form-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(12,68,128,0.18), transparent);
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.83rem;
      color: var(--label);
      letter-spacing: 0.01em;
    }

    .form-control {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      background: #f4f9fe;
      color: var(--text-head);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .form-control::placeholder { color: #90afc4; }
    .form-control:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 3.5px var(--focus-ring);
      outline: none;
    }
    .form-control.is-invalid {
      border-color: var(--error);
      background: var(--error-bg);
    }
    .form-control.is-invalid:focus {
      box-shadow: 0 0 0 3.5px rgba(185,28,28,0.12);
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-signup {
      width: 100%;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
      color: #fff;
      font-family: var(--font);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.78rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 14px rgba(12,68,128,0.4);
      transition: box-shadow 0.18s, transform 0.12s, filter 0.18s;
      margin-top: 0.5rem;
    }
    .btn-signup:hover  { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(12,68,128,0.5); }
    .btn-signup:active { transform: scale(0.98); filter: brightness(0.95); }
    .btn-signup:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }

    .field-error {
      display: none;
      color: #7f1d1d;
      font-size: 0.78rem;
      margin-top: 0.3rem;
      align-items: center;
      gap: 5px;
    }
    .field-error.visible { display: flex; }

    .strength-bar {
      height: 4px;
      border-radius: 4px;
      background: #d0e6f5;
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s, background 0.3s;
    }
    .strength-label {
      font-size: 0.75rem;
      margin-top: 3px;
      color: var(--text-sub);
    }

    .login-link { font-size: 0.85rem; color: var(--text-sub); text-align: center; margin-top: 1.1rem; }
    .login-link a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .login-link a:hover { color: var(--brand-deep); }
    .login-link a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 2px; }

    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      background: var(--brand);
      color: #fff;
      padding: 0.4rem 0.9rem;
      border-radius: 0 0 6px 6px;
      font-size: 0.875rem;
      text-decoration: none;
      z-index: 999;
    }
    .skip-link:focus { top: 0; }

    .alert-danger {
      background: var(--error-bg);
      border-color: #fecaca;
      color: #7f1d1d;
      border-radius: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#signupForm">Skip to sign up form</a>

  <div class="card">

    <h1>Create an account</h1>
    <p class="subtitle">Fill in your details to get started.</p>
    <div class="form-divider"></div>

    <form id="signupForm" novalidate>

      <div class="name-row mb-3">
        <div>
          <label for="fname" class="form-label">
            First name
            <span aria-hidden="true" style="color:#b91c1c;">*</span>
            <span class="visually-hidden">(required)</span>
          </label>
          <input
            type="text" class="form-control" id="fname"
            autocomplete="given-name" placeholder="Jane"
            required aria-required="true" aria-describedby="fnameError"
          />
          <div id="fnameError" class="field-error" role="alert">
            <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
            <span id="fnameErrorText"></span>
          </div>
        </div>
        <div>
          <label for="lname" class="form-label">
            Last name
            <span aria-hidden="true" style="color:#b91c1c;">*</span>
            <span class="visually-hidden">(required)</span>
          </label>
          <input
            type="text" class="form-control" id="lname"
            autocomplete="family-name" placeholder="Doe"
            required aria-required="true" aria-describedby="lnameError"
          />
          <div id="lnameError" class="field-error" role="alert">
            <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
            <span id="lnameErrorText"></span>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">
          Email address
          <span aria-hidden="true" style="color:#b91c1c;">*</span>
          <span class="visually-hidden">(required)</span>
        </label>
        <input
          type="email" class="form-control" id="email"
          autocomplete="email" placeholder="you@example.com"
          required aria-required="true" aria-describedby="emailError"
        />
        <div id="emailError" class="field-error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span id="emailErrorText"></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">
          Password
          <span aria-hidden="true" style="color:#b91c1c;">*</span>
          <span class="visually-hidden">(required)</span>
        </label>
        <input
          type="password" class="form-control" id="password"
          autocomplete="new-password" placeholder="Min. 8 characters"
          required aria-required="true" minlength="8"
          aria-describedby="passwordError passwordStrengthLabel"
        />
        <div class="strength-bar" aria-hidden="true">
          <div class="strength-bar-fill" id="strengthFill"></div>
        </div>
        <div id="passwordStrengthLabel" class="strength-label" aria-live="polite"></div>
        <div id="passwordError" class="field-error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span id="passwordErrorText"></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">
          Confirm password
          <span aria-hidden="true" style="color:#b91c1c;">*</span>
          <span class="visually-hidden">(required)</span>
        </label>
        <input
          type="password" class="form-control" id="confirmPassword"
          autocomplete="new-password" placeholder="Repeat your password"
          required aria-required="true" aria-describedby="confirmError"
        />
        <div id="confirmError" class="field-error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span id="confirmErrorText"></span>
        </div>
      </div>

      <button type="submit" class="btn-signup">Create account</button>

    </form>

    <p class="login-link">
      Already have an account? <a href="index.html">Sign in</a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>

    document.getElementById('password').addEventListener('input', function () {
      const val = this.value;
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('passwordStrengthLabel');

      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { width: '0%',   color: '#d0e6f5', text: '' },
        { width: '25%',  color: '#ef4444', text: 'Weak' },
        { width: '50%',  color: '#f97316', text: 'Fair' },
        { width: '75%',  color: '#eab308', text: 'Good' },
        { width: '100%', color: '#22c55e', text: 'Strong' },
      ];

      fill.style.width      = levels[score].width;
      fill.style.background = levels[score].color;
      label.textContent     = val.length ? 'Strength: ' + levels[score].text : '';
    });

    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const fields = [
        { id: 'fname',           errId: 'fnameError',    txtId: 'fnameErrorText',    msg: 'First name is required.' },
        { id: 'lname',           errId: 'lnameError',    txtId: 'lnameErrorText',    msg: 'Last name is required.' },
        { id: 'email',           errId: 'emailError',    txtId: 'emailErrorText',    msg: 'Email is required.' },
        { id: 'password',        errId: 'passwordError', txtId: 'passwordErrorText', msg: 'Password is required.' },
        { id: 'confirmPassword', errId: 'confirmError',  txtId: 'confirmErrorText',  msg: 'Please confirm your password.' },
      ];

      fields.forEach(f => {
        const input = document.getElementById(f.id);
        input.removeAttribute('aria-invalid');
        input.classList.remove('is-invalid');
        document.getElementById(f.errId).classList.remove('visible');
      });

      let valid = true;

      fields.forEach(f => {
        const input = document.getElementById(f.id);
        if (!input.value.trim()) {
          showFieldError(input, f.errId, f.txtId, f.msg);
          valid = false;
        }
      });

      const emailInput = document.getElementById('email');
      if (emailInput.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
        showFieldError(emailInput, 'emailError', 'emailErrorText', 'Enter a valid email address.');
        valid = false;
      }

      const pwInput = document.getElementById('password');
      if (pwInput.value && pwInput.value.length < 8) {
        showFieldError(pwInput, 'passwordError', 'passwordErrorText', 'Password must be at least 8 characters.');
        valid = false;
      }

      const pw  = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      if (pw && cpw && pw !== cpw) {
        showFieldError(document.getElementById('confirmPassword'), 'confirmError', 'confirmErrorText', 'Passwords do not match.');
        valid = false;
      }

      if (!valid) {
        document.querySelector('[aria-invalid="true"]').focus();
        return;
      }

      // Send the validated data to the PHP API
      fetch("http://161.35.111.8/LAMPAPI/Register.php", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json" 
        },
        body: JSON.stringify({
          login: document.getElementById("email").value,
          password: document.getElementById("password").value,
          firstName: document.getElementById("fname").value,
          lastName: document.getElementById("lname").value
        })
      })
      .then(response => response.json())
      .then(data => {
        // If the API returns no error string, registration was successful
        if (data.error === "") {
          alert("Account created successfully! Redirecting to login...");
          window.location.href = "index.html";
        } else {
          // If the API throws an error (e.g., email already exists), show it
          alert("Registration failed: " + data.error);
        }
      })
      .catch(error => {
        console.error("Error during registration:", error);
        alert("Could not connect to the server.");
      });
    });

    function showFieldError(input, errId, txtId, msg) {
      input.setAttribute('aria-invalid', 'true');
      input.classList.add('is-invalid');
      document.getElementById(txtId).textContent = msg;
      document.getElementById(errId).classList.add('visible');
    }

  </script>

</body>
</html>
