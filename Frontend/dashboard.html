<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand:     #0c4480;
      --brand-mid: #1560a0;
      --bg:        #f0f7ff;
      --surface:   #ffffff;
      --border:    #daeaf8;
      --text:      #0a1e30;
      --muted:     #5a7d95;
      --font:      'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-icon {
      width: 30px;
      height: 30px;
      background: var(--brand);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .nav-icon i { color: #fff; font-size: 0.85rem; }

    .nav-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      height: 34px;
      width: 260px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap:focus-within {
      border-color: var(--brand-mid);
      box-shadow: 0 0 0 3px rgba(21,96,160,0.12);
    }
    .search-wrap i { color: var(--muted); font-size: 0.8rem; flex-shrink: 0; }
    .search-wrap input {
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 0.835rem;
      color: var(--text);
      outline: none;
      width: 100%;
    }
    .search-wrap input::placeholder { color: #9ab8cc; }

    .nav-spacer { flex: 1; }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--brand);
      color: #fff;
      font-family: var(--font);
      font-size: 0.835rem;
      font-weight: 600;
      padding: 0 14px;
      height: 34px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-add:hover { background: var(--brand-mid); }
    .btn-add i { font-size: 0.9rem; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #d0e8f8;
      border: 1.5px solid var(--border);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .avatar i { color: var(--brand); font-size: 0.9rem; }

    /* ── PAGE CONTENT ── */
    .page {
      padding: 28px 24px;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }
    .page-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .count-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* placeholder */
    .empty {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
    }
    .empty i { font-size: 2rem; opacity: 0.3; }
    .empty p { font-size: 0.875rem; }
  </style>
</head>
<body>

  <nav aria-label="Main navigation">
    <div class="nav-icon" aria-hidden="true">
      <i class="bi bi-layers"></i>
    </div>

    <div class="nav-divider"></div>

    <div class="search-wrap">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input type="search" placeholder="Search contacts…" aria-label="Search contacts" />
    </div>

    <div class="nav-spacer"></div>

    <button class="btn-add">
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
      Add Contact
    </button>

    <div class="avatar" role="button" tabindex="0" aria-label="User menu">
      <i class="bi bi-person"></i>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1>Contacts</h1>
      <span class="count-badge">0</span>
    </div>

    <div class="empty">
      <i class="bi bi-people"></i>
      <p>No contacts yet — add one to get started</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
