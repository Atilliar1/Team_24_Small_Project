<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand:     #0c4480;
      --brand-mid: #1560a0;
      --bg:        #f0f7ff;
      --surface:   #ffffff;
      --border:    #daeaf8;
      --text:      #0a1e30;
      --muted:     #5a7d95;
      --font:      'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-icon {
      width: 30px;
      height: 30px;
      background: var(--brand);
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .nav-icon i {
      color: #fff;
      font-size: 0.85rem;
    }

    .nav-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      height: 34px;
      width: 260px;
      transition: border-color .15s, box-shadow .15s;
    }

    .search-wrap:focus-within {
      border-color: var(--brand-mid);
      box-shadow: 0 0 0 3px rgba(21,96,160,0.12);
    }

    .search-wrap i {
      color: var(--muted);
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .search-wrap input {
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 0.835rem;
      color: var(--text);
      outline: none;
      width: 100%;
    }

    .search-wrap input::placeholder {
      color: #9ab8cc;
    }

    .nav-spacer {
      flex: 1;
    }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--brand);
      color: #fff;
      font-family: var(--font);
      font-size: 0.835rem;
      font-weight: 600;
      padding: 0 14px;
      height: 34px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: var(--brand-mid);
    }

    .btn-add i {
      font-size: 0.9rem;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #d0e8f8;
      border: 1.5px solid var(--border);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .avatar i {
      color: var(--brand);
      font-size: 0.9rem;
    }

    .page {
      padding: 28px 24px;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .count-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .empty {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
    }

    .empty i {
      font-size: 2rem;
      opacity: 0.3;
    }

    .empty p {
      font-size: 0.875rem;
    }

    .modal-content {
      border: none;
      border-radius: 18px;
      overflow: hidden;
      font-family: var(--font);
    }

    .modal-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 22px;
    }

    .modal-title {
      font-weight: 700;
      color: var(--text);
    }

    .modal-body {
      padding: 22px;
      background: #f9fcff;
    }

    .modal-footer {
      border-top: 1px solid var(--border);
      padding: 16px 22px;
      background: var(--surface);
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-control,
    .form-control:focus {
      border-radius: 10px;
      border-color: var(--border);
      box-shadow: none;
      font-size: 0.9rem;
      padding: 10px 12px;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    .btn-brand {
      background: var(--brand);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
    }

    .btn-brand:hover {
      background: var(--brand-mid);
      color: white;
    }

    .btn-light-custom {
      background: #eef5fc;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
    }

    .btn-light-custom:hover {
      background: #e4eff9;
    }
  </style>
</head>

<body>

  <nav aria-label="Main navigation">
    <div class="nav-icon" aria-hidden="true">
      <i class="bi bi-layers"></i>
    </div>

    <div class="nav-divider"></div>

    <div class="search-wrap">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input type="search" placeholder="Search contacts…" aria-label="Search contacts" />
    </div>

    <div class="nav-spacer"></div>

    <button
      class="btn-add"
      data-bs-toggle="modal"
      data-bs-target="#addContactModal"
    >
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
      Add Contact
    </button>

   

    <div class="avatar" role="button" tabindex="0" aria-label="User menu">
      <i class="bi bi-person"></i>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1>Contacts</h1>
      <span class="count-badge">0</span>
    </div>

    <div class="empty">
      <i class="bi bi-people"></i>
      <p>No contacts yet — add one to get started</p>
    </div>
  </main>

  <div
    class="modal fade"
    id="addContactModal"
    tabindex="-1"
    aria-labelledby="addContactModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="addContactModalLabel">
            Add Contact
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">
          <form id="addContactForm">

            <div class="row g-3">

              <div class="col-md-6">
                <label for="addFirstName" class="form-label">
                  First Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="addFirstName"
                  name="FirstName"
                  placeholder="Enter first name"
                >
              </div>

              <div class="col-md-6">
                <label for="addLastName" class="form-label">
                  Last Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="addLastName"
                  name="LastName"
                  placeholder="Enter last name"
                >
              </div>

              <div class="col-md-6">
                <label for="addEmail" class="form-label">
                  Email
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="addEmail"
                  name="Email"
                  placeholder="Enter email"
                >
              </div>

              <div class="col-md-6">
                <label for="addPhone" class="form-label">
                  Phone
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="addPhone"
                  name="Phone"
                  placeholder="Enter phone number"
                >
              </div>

              <div class="col-12">
                <label for="addAddress" class="form-label">
                  Address
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="addAddress"
                  name="Address"
                  placeholder="Enter address"
                >
              </div>

              
              <div class="col-12">
                <label for="addNotes" class="form-label">
                  Notes
                </label>

                <textarea
                  class="form-control"
                  id="addNotes"
                  name="Notes"
                  placeholder="Enter notes"
                ></textarea>
              </div>

            </div>

          </form>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn-light-custom"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button
            type="submit"
            form="addContactForm"
            class="btn-brand"
          >
            Save Contact
          </button>
        </div>

      </div>
    </div>
  </div>

  <div
    class="modal fade"
    id="editContactModal"
    tabindex="-1"
    aria-labelledby="editContactModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="editContactModalLabel">
            Edit Contact
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">
          <form id="editContactForm">

            <div class="row g-3">

              <div class="col-md-6">
                <label for="editFirstName" class="form-label">
                  First Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="editFirstName"
                  name="FirstName"
                  placeholder="Enter first name"
                >
              </div>

              <div class="col-md-6">
                <label for="editLastName" class="form-label">
                  Last Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="editLastName"
                  name="LastName"
                  placeholder="Enter last name"
                >
              </div>

              <div class="col-md-6">
                <label for="editEmail" class="form-label">
                  Email
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="editEmail"
                  name="Email"
                  placeholder="Enter email"
                >
              </div>

              <div class="col-md-6">
                <label for="editPhone" class="form-label">
                  Phone
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="editPhone"
                  name="Phone"
                  placeholder="Enter phone number"
                >
              </div>

              <div class="col-12">
                <label for="editAddress" class="form-label">
                  Address
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="editAddress"
                  name="Address"
                  placeholder="Enter address"
                >
              </div>

              
              <div class="col-12">
                <label for="editNotes" class="form-label">
                  Notes
                </label>

                <textarea
                  class="form-control"
                  id="editNotes"
                  name="Notes"
                  placeholder="Enter notes"
                ></textarea>
              </div>

            </div>

          </form>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn-light-custom"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button
            type="submit"
            form="editContactForm"
            class="btn-brand"
          >
            Update Contact
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const API_BASE = 'http://161.35.111.8/LAMPAPI';

  let currentContactId = null;

  window.addEventListener('DOMContentLoaded', function () {
    loadContacts();

    const searchInput = document.querySelector('.search-wrap input');

    searchInput.addEventListener('input', function () {
      filterContacts(this.value);
    });

    document
      .getElementById('editContactForm')
      .addEventListener('submit', updateContact);
  });

  function loadContacts() {
    const userId = sessionStorage.getItem('userId');

    if (!userId) {
      window.location.href = 'index.html';
      return;
    }

    fetch(API_BASE + '/SearchContact.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        userId: userId,
        search: ''
      })
    })
    .then(function(response) {
      return response.json();
    })
    .then(function(data) {

      if (data.error === '') {
        renderContacts(data.results);
      }
      else {
        renderContacts([]);
      }

    })
    .catch(function(err) {
      console.error('Failed to load contacts:', err);
    });
  }

  function renderContacts(contacts) {

    const main = document.querySelector('main.page');
    const emptyDiv = main.querySelector('.empty');
    const countBadge = document.querySelector('.count-badge');

    countBadge.textContent = contacts.length;

    const existingList = document.getElementById('contactList');

    if (existingList) {
      existingList.remove();
    }

    if (contacts.length === 0) {

      if (emptyDiv) {
        emptyDiv.style.display = 'flex';
      }

      return;
    }

    if (emptyDiv) {
      emptyDiv.style.display = 'none';
    }

    const list = document.createElement('div');

    list.id = 'contactList';

    list.style.cssText =
      'display:flex;' +
      'flex-direction:column;' +
      'gap:10px;';

    contacts.forEach(function(contact) {

      const card = document.createElement('div');

      card.className = 'contact-card';

      card.style.cssText =
        'background:#fff;' +
        'border:1px solid var(--border);' +
        'border-radius:12px;' +
        'padding:16px 20px;' +
        'display:flex;' +
        'align-items:center;' +
        'gap:16px;';

      card.setAttribute(
        'data-search',
        (
          (contact.firstName || '') + ' ' +
          (contact.lastName || '') + ' ' +
          (contact.email || '') + ' ' +
          (contact.phone || '') + ' ' +
          (contact.address || '') + ' ' +
          (contact.notes || '')
        ).toLowerCase()
      );

      card.innerHTML =
        '<div style="flex:1;">' +

          '<div style="font-weight:600;color:var(--text);">' +
            contact.firstName + ' ' + contact.lastName +
          '</div>' +

          '<div style="font-size:0.85rem;color:var(--muted);margin-top:4px;">' +

            (contact.email ? contact.email : '') +

            (contact.phone
              ? ' &nbsp;·&nbsp; ' + contact.phone
              : '') +

          '</div>' +

        '</div>' +

        '<button class="btn-brand edit-btn">' +
          'Edit' +
        '</button>';

      card.querySelector('.edit-btn')
        .addEventListener('click', function () {
          openEditModal(contact);
        });

      list.appendChild(card);
    });

    main.appendChild(list);
  }

  function openEditModal(contact) {

    currentContactId = contact.id;

    document.getElementById('editFirstName').value =
      contact.firstName || '';

    document.getElementById('editLastName').value =
      contact.lastName || '';

    document.getElementById('editEmail').value =
      contact.email || '';

    document.getElementById('editPhone').value =
      contact.phone || '';

    document.getElementById('editAddress').value =
      contact.address || '';

    document.getElementById('editNotes').value =
      contact.notes || '';

    const modal =
      new bootstrap.Modal(
        document.getElementById('editContactModal')
      );

    modal.show();
  }

  function updateContact(event) {

    event.preventDefault();

    const userId = sessionStorage.getItem('userId');

    fetch(API_BASE + '/UpdateContact.php', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({

        id: currentContactId,

        userId: userId,

        firstName:
          document.getElementById('editFirstName').value,

        lastName:
          document.getElementById('editLastName').value,

        email:
          document.getElementById('editEmail').value,

        phone:
          document.getElementById('editPhone').value,

        address:
          document.getElementById('editAddress').value,

        notes:
          document.getElementById('editNotes').value
      })
    })

    .then(function(response) {
      return response.json();
    })

    .then(function(data) {

      if (data.error === '') {

        bootstrap.Modal
          .getInstance(
            document.getElementById('editContactModal')
          )
          .hide();

        loadContacts();

        alert('Contact updated successfully');
      }
      else {

        alert(data.error);
      }
    })

    .catch(function(error) {

      console.error(error);

      alert('Failed to update contact');
    });
  }

  function filterContacts(searchText) {

    const cards = document.querySelectorAll('.contact-card');

    const search = searchText.toLowerCase().trim();

    let visibleCount = 0;

    cards.forEach(function(card) {

      const searchableText =
        card.getAttribute('data-search');

      if (searchableText.includes(search)) {

        card.style.display = 'flex';

        visibleCount++;
      }
      else {

        card.style.display = 'none';
      }
    });

    document.querySelector('.count-badge')
      .textContent = visibleCount;
  }
</script>

</body>
</html>
