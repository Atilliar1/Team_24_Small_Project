<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – SM App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f1f3d;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      background: #ffffff;
      padding: 2.25rem 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.6rem;
    }
    .brand-dot {
      width: 34px;
      height: 34px;
      background-color: #1a3a6b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-dot i { color: #fff; font-size: 1rem; }
    .brand-name { font-weight: 700; font-size: 1rem; color: #0f1f3d; }

    h1 { font-size: 1.5rem; font-weight: 700; color: #0f1f3d; margin-bottom: 0.25rem; }
    .subtitle { color: #6b7280; font-size: 0.875rem; margin-bottom: 1.6rem; }

    label { font-weight: 600; font-size: 0.85rem; color: #1a3a6b; }

    .form-control {
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .form-control:focus {
      border-color: #1a3a6b;
      box-shadow: 0 0 0 3px rgba(26, 58, 107, 0.15);
    }
    .form-control.is-invalid { border-color: #b91c1c; }

    .btn-signin {
      width: 100%;
      background-color: #1a3a6b;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      transition: background 0.18s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-signin:hover  { background-color: #0f2a55; color: #fff; }
    .btn-signin:active { transform: scale(0.98); background-color: #091e3e; color: #fff; }
    .btn-signin:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }

    .field-error {
      display: none;
      color: #7f1d1d;
      font-size: 0.8rem;
      margin-top: 0.3rem;
      align-items: center;
      gap: 5px;
    }
    .field-error.visible { display: flex; }

    .signup-link a {
      color: #1a3a6b;
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
    }
    .signup-link a:hover { color: #0f2a55; }
    .signup-link a:focus-visible { outline: 2px solid #1a3a6b; outline-offset: 2px; border-radius: 2px; }

    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      background: #1a3a6b;
      color: #fff;
      padding: 0.4rem 0.9rem;
      border-radius: 0 0 6px 6px;
      font-size: 0.875rem;
      text-decoration: none;
      z-index: 999;
    }
    .skip-link:focus { top: 0; }
  </style>
</head>
<body>

  <a class="skip-link" href="#loginForm">Skip to login form</a>

  <div class="card">

    <div class="brand" aria-hidden="true">
      <div class="brand-dot">
        <i class="bi bi-layers"></i>
      </div>
      <span class="brand-name">SpApp</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account.</p>

    <div id="loginAlert" class="alert alert-danger d-none" role="alert" aria-live="assertive">
      <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>
      <span id="loginAlertText"></span>
    </div>

    <form id="loginForm" novalidate>

      <div class="mb-3">
        <label for="email" class="form-label">
          Email address
          <span aria-hidden="true" style="color:#b91c1c;">*</span>
          <span class="visually-hidden">(required)</span>
        </label>
        <input
          type="email" class="form-control" id="email"
          autocomplete="email" placeholder="tree@yahoo.com"
          required aria-required="true" aria-describedby="emailError"
        />
        <div id="emailError" class="field-error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span id="emailErrorText"></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">
          Password
          <span aria-hidden="true" style="color:#b91c1c;">*</span>
          <span class="visually-hidden">(required)</span>
        </label>
        <input
          type="password" class="form-control" id="password"
          autocomplete="current-password" placeholder="••••••••"
          required aria-required="true" aria-describedby="passwordError"
        />
        <div id="passwordError" class="field-error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span id="passwordErrorText"></span>
        </div>
      </div>

      <button type="submit" class="btn-signin">Sign in</button>

    </form>

    <p class="text-center mt-3 signup-link" style="font-size:0.875rem; color:#6b7280;">
      Don't have an account? <a href="SignUp.html">Create one</a>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const email    = document.getElementById('email');
      const password = document.getElementById('password');
      const emailErr = document.getElementById('emailError');
      const emailTxt = document.getElementById('emailErrorText');
      const pwErr    = document.getElementById('passwordError');
      const pwTxt    = document.getElementById('passwordErrorText');

      [email, password].forEach(i => {
        i.removeAttribute('aria-invalid');
        i.classList.remove('is-invalid');
      });
      emailErr.classList.remove('visible');
      pwErr.classList.remove('visible');

      let valid = true;

      if (!email.value.trim()) {
        showFieldError(email, emailErr, emailTxt, 'Email is required.');
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
        showFieldError(email, emailErr, emailTxt, 'Enter a valid email address.');
        valid = false;
      }

      if (!password.value) {
        showFieldError(password, pwErr, pwTxt, 'Password is required.');
        valid = false;
      }

      if (!valid) {
        document.querySelector('[aria-invalid="true"]').focus();
        return;
      }

      // TODO: connect to API
    });

    function showFieldError(input, errEl, txtEl, msg) {
      input.setAttribute('aria-invalid', 'true');
      input.classList.add('is-invalid');
      txtEl.textContent = msg;
      errEl.classList.add('visible');
    }
  </script>

</body>
</html>
