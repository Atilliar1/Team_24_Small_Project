<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – SM App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-from:    #6aaee0;
      --bg-to:      #89c0eb;
      --card-bg:    #ffffff;
      --brand:      #0c4480;
      --brand-dark: #093568;
      --brand-deep: #062650;
      --text-head:  #05111e;
      --text-sub:   #456070;
      --label:      #0c4480;
      --border:     #7ab2d8;
      --focus-ring: rgba(12, 68, 128, 0.22);
      --error:      #b91c1c;
      --error-bg:   #fef2f2;
      --font:       'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-to) 100%);
      position: relative;
      overflow: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(12,68,128,0.15) 0%, transparent 70%);
      top: -160px; right: -160px;
    }
    body::after {
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(12,68,128,0.10) 0%, transparent 70%);
      bottom: -120px; left: -120px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(12,68,128,0.18);
      border-radius: 20px;
      box-shadow:
        0 2px 4px rgba(5,17,30,0.06),
        0 8px 24px rgba(5,17,30,0.14),
        0 24px 56px rgba(5,17,30,0.10);
      background: var(--card-bg);
      padding: 2.5rem 2.25rem;
      animation: rise 0.45s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-head);
      margin-bottom: 0.3rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--text-sub);
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
    }

    .form-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(12,68,128,0.18), transparent);
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.83rem;
      color: var(--label);
      letter-spacing: 0.01em;
    }

    .form-control {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      background: #f4f9fe;
      color: var(--text-head);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .form-control::placeholder { color: #90afc4; }
    .form-control:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 3.5px var(--focus-ring);
      outline: none;
    }
    .form-control.is-invalid {
      border-color: var(--error);
      background: var(--error-bg);
    }
    .form-control.is-invalid:focus {
      box-shadow: 0 0 0 3.5px rgba(185,28,28,0.12);
    }

    .btn-signin {
      width: 100%;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
      color: #fff;
      font-family: var(--font);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.78rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 14px rgba(12,68,128,0.4);
      transition: box-shadow 0.18s, transform 0.12s, filter 0.18s;
      margin-top: 0.5rem;
    }
    .btn-signin:hover  { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(12,68,128,0.5); }
    .btn-signin:active { transform: scale(0.98); filter: brightness(0.95); }
    .btn-signin:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
    .btn-signin:disabled { opacity: 0.7; cursor: not-allowed; }

    .field-error {
      display: none;
      color: #7f1d1d;
      font-size: 0.78rem;
      margin-top: 0.3rem;
      align-items: center;
      gap: 5px;
    }
    .field-error.visible { display: flex; }

    .signup-link { font-size: 0.85rem; color: var(--text-sub); text-align: center; margin-top: 1.1rem; }
    .signup-link a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .signup-link a:hover { color: var(--brand-deep); }

    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      background: var(--brand);
      color: #fff;
      padding: 0.4rem 0.9rem;
      border-radius: 0 0 6px 6px;
      font-size: 0.875rem;
      text-decoration: none;
      z-index: 999;
    }
    .skip-link:focus { top: 0; }

    main { display: contents; }

    .alert-danger {
      background: var(--error-bg);
      border-color: #fecaca;
      color: #7f1d1d;
      border-radius: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#loginForm">Skip to login form</a>

  <main>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your account.</p>
    <div class="form-divider"></div>

    <div id="loginAlert" class="alert alert-danger d-none" role="alert" aria-live="assertive">
      <i class="bi bi-exclamation-circle me-2" aria-hidden="true"></i>
      <span id="loginAlertText"></span>
    </div>

    <form id="loginForm" novalidate>

      <div class="mb-3">
        <label for="username" class="form-label">
          Username
          <span aria-hidden="true" style="color:#b91c1c;">*</span>
          <span class="visually-hidden">(required)</span>
        </label>
        <input
          type="text" class="form-control" id="username"
          autocomplete="username" placeholder="Enter your username"
          required aria-required="true" aria-describedby="usernameError"
        />
        <div id="usernameError" class="field-error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span id="usernameErrorText"></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">
          Password
          <span aria-hidden="true" style="color:#b91c1c;">*</span>
          <span class="visually-hidden">(required)</span>
        </label>
        <input
          type="password" class="form-control" id="password"
          autocomplete="current-password" placeholder="••••••••"
          required aria-required="true" aria-describedby="passwordError"
        />
        <div id="passwordError" class="field-error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span id="passwordErrorText"></span>
        </div>
      </div>

      <button type="submit" class="btn-signin" id="submitBtn">Sign in</button>

    </form>

    <p class="signup-link">
      Don't have an account? <a href="SignUp.html">Create one</a>
    </p>
  </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = 'http://161.35.111.8/LAMPAPI';

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username    = document.getElementById('username');
      const password    = document.getElementById('password');
      const usernameErr = document.getElementById('usernameError');
      const usernameTxt = document.getElementById('usernameErrorText');
      const pwErr       = document.getElementById('passwordError');
      const pwTxt       = document.getElementById('passwordErrorText');
      const alert       = document.getElementById('loginAlert');
      const alertText   = document.getElementById('loginAlertText');
      const submitBtn   = document.getElementById('submitBtn');

      // Clear previous errors
      [username, password].forEach(i => {
        i.removeAttribute('aria-invalid');
        i.classList.remove('is-invalid');
      });
      usernameErr.classList.remove('visible');
      pwErr.classList.remove('visible');
      alert.classList.add('d-none');

      // Validate fields
      let valid = true;
      if (!username.value.trim()) {
        showFieldError(username, usernameErr, usernameTxt, 'Username is required.');
        valid = false;
      }
      if (!password.value) {
        showFieldError(password, pwErr, pwTxt, 'Password is required.');
        valid = false;
      }
      if (!valid) {
        document.querySelector('[aria-invalid="true"]').focus();
        return;
      }

      // Call Login.php
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const response = await fetch(`${API_BASE}/Login.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: username.value.trim(),
            password: password.value
          })
        });

        const data = await response.json();

        if (data.error !== '') {
          // Show error alert
          alertText.textContent = data.error;
          alert.classList.remove('d-none');
        } else {
          // Save user info and redirect to dashboard
          sessionStorage.setItem('userId',    data.id);
          sessionStorage.setItem('firstName', data.firstName);
          sessionStorage.setItem('lastName',  data.lastName);
          window.location.href = 'dashboard.html';
        }

      } catch (err) {
        alertText.textContent = 'Unable to connect to server. Please try again.';
        alert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });

    function showFieldError(input, errEl, txtEl, msg) {
      input.setAttribute('aria-invalid', 'true');
      input.classList.add('is-invalid');
      txtEl.textContent = msg;
      errEl.classList.add('visible');
    }
  </script>

</body>
</html>
